services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-model_intent}
      POSTGRES_USER: ${POSTGRES_USER:-model_intent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-model_intent_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - model_intent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-model_intent} -d ${POSTGRES_DB:-model_intent}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  model_intent_pgdata:
