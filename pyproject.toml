[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "model-intent-poc"
version = "0.1.0"
description = "Streamlit category and property intent analysis with E5 and pgvector"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.4,<3.5",
  "torch>=2.6,<2.7",
  "transformers>=4.48,<4.49",
  "tokenizers>=0.21,<0.22",
  "huggingface-hub>=0.27,<0.28",
]
db = [
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
]
ui = ["streamlit>=1.40,<2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
  "sentence-transformers>=3.4,<3.5",
  "torch>=2.6,<2.7",
  "transformers>=4.48,<4.49",
  "tokenizers>=0.21,<0.22",
  "huggingface-hub>=0.27,<0.28",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "streamlit>=1.40,<2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
model-intent = "model_intent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_model: requires a downloaded embedding model",
  "pgvector: requires DATABASE_URL and a migrated pgvector database",
  "pgvector_write: requires explicit disposable scratch DB; never run on unified serving data",
]
