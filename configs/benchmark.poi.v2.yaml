seed: 17
threads: 2
retrieval_backend: numpy
cache_dir: .cache/model-intent-poi
output_dir: artifacts/benchmark-poi-v2
enrichment_path: data/taxonomies/place_type_enrichment.rich.poc.v2.json
policy_path: data/policies/place_type_decision_policy.poc.v1.json
confidence_calibration_path: data/policies/e5_base_confidence_calibration.v2.json
languages: [vi, en]
top_k: 5
warmup_queries: 1
latency_repeats: 1
models:
  - key: e5-base-multilingual
    model_id: intfloat/multilingual-e5-base
    expected_dimension: 768
    revision: d128750597153bb5987e10b1c3493a34e5a4502a
    query_prefix: "query: "
    document_prefix: "passage: "
    batch_size: 16
    max_seq_length: 128
    enabled: true
    stretch: false
poi_search:
  backend: artifact
  dataset_key: hcmc-osm
  artifact_path: artifacts/osm/hcmc-poc-v4/pois.jsonl
  property_path: data/properties/poi_properties.poc.v4.json
  ranking_policy_path: data/policies/poi_ranking.poc.v2.json
  mapping_path: data/osm/mappings/place_types.poc.v2.json
