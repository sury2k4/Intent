seed: 17
threads: 8
retrieval_backend: pgvector
retrieval_mode: pg_exact
db_pool_min_size: 1
db_pool_max_size: 8
db_pool_timeout_seconds: 10
db_statement_timeout_ms: 5000
hnsw_ef_search: 100
hnsw_overfetch: 200
cache_dir: .cache/model-intent
output_dir: artifacts/benchmark
enrichment_path: data/taxonomies/place_type_enrichment.rich.poc.v1.json
policy_path: data/policies/place_type_decision_policy.poc.v1.json
confidence_calibration_path: data/policies/e5_base_confidence_calibration.v1.json
languages: [vi, en]
top_k: 5
warmup_queries: 2
latency_repeats: 3
models:
