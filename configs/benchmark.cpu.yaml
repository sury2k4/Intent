    model_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    expected_dimension: 384
    query_prefix: ""
    document_prefix: ""
    batch_size: 32
    max_seq_length: 128
    enabled: true
    stretch: false
  - key: e5-small-multilingual
    model_id: intfloat/multilingual-e5-small
    expected_dimension: 384
    revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
    query_prefix: "query: "
    document_prefix: "passage: "
    batch_size: 32
    max_seq_length: 256
    enabled: true
    stretch: false
  - key: e5-base-multilingual
    model_id: intfloat/multilingual-e5-base
    expected_dimension: 768
    revision: d128750597153bb5987e10b1c3493a34e5a4502a
    query_prefix: "query: "
    document_prefix: "passage: "
    batch_size: 16
    max_seq_length: 128
    enabled: true
    stretch: false
  - key: bge-m3
    model_id: BAAI/bge-m3
    expected_dimension: 1024
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    query_prefix: ""
    document_prefix: ""
    batch_size: 4
    max_seq_length: 128
    enabled: true
    stretch: true
poi_search:
  backend: postgres
  dataset_key: hcmc-osm
  artifact_path: artifacts/osm/hcmc-poc-v1/pois.jsonl
